# Minted idea pages come from `@rookery/core`'s `.marrow.typ`. 0.6.2 is the
# first release that finds the marrow of a package fetched from a repository
# ref: 0.6.1 located it by probing Typst's directory layout, which a ref-backed
# checkout (keyed by resolved commit) never matches, so every `ideas/*.html`
# page went unwritten on a build that succeeded silently. 0.6.2 is still the
# floor the packages declare; this site builds on 0.6.4.
version = "0.6.4"
content_dir = "content"

# `@rookery` is not a namespace rheo ships, so without this table the imports in
# `content/site.typ` resolve nowhere. The packages live at the repository root
# as `<name>/<version>/`, which is the layout rheo expects, so no `subdir`.
#
# A BRANCH, not a tag: `dev` is re-resolved on every build, so a push to it
# changes what this project compiles against without any edit here. The package
# versions in `content/site.typ`'s imports must be ones `dev` carries (it holds
# `core/0.1.1` and `search/0.1.1`, and search imports core at 0.1.1). Pin
# `rev = "<sha>"` instead if that ever matters.
[packages.rookery]
repo = "https://github.com/freecomputinglab/rookery"
branch = "dev"

# `site.typ` is a library, not a page, and everything under `data/` is a plain
# dictionary — without this each would compile to a page of its own. Global, so
# it holds for every format.
[spine]
# rheo 0.6.3 synthesizes a landing page for any directory without one, which
# here means an unstyled `listings.html` that nothing links to and the deployed
# site has never had. Off restores the old group-node behaviour. Unlike
# `exclude` this key falls back field-by-field, so it holds for every format.
auto_index = false
exclude = [
  "site.typ",
  "data/artifacts.typ",
  "data/books.typ",
  "data/digital-archives.typ",
  "data/documentaries.typ",
  "data/events.typ",
  "data/funding.typ",
  "data/hacker-archives.typ",
  "data/magazines.typ",
  "data/people.typ",
  "data/practice.typ",
  "data/tools.typ",
]

# Declared as assets rather than written into the page by hand, so rheo emits
# them depth-relative: the site is now more than one level deep (`listings/`,
# and the `ideas/` pages rookery mints), where a bare `index.js` would 404.
[[html.assets]]
css_stylesheet = "./style.css"

[[html.assets]]
js_scripts = "./index.js"

# A per-format `exclude` REPLACES the global one rather than adding to it
# (MEASURED: with only the four view pages listed here, `data/*.typ` and
# `site.typ` both came back as chapters in the EPUB), so each list below repeats
# everything above and then adds its own.
#
# `index.typ` and `resources.typ` are views — windows onto ideas hatched under
# `listings/` — so including them in a paged target would print every entry
# twice, once as a window and once where it was hatched.
[pdf.spine]
title = "Hacker Archives"
# No `merge` key: it was retired in rheo 0.6, which warns that it has no effect
# — a PDF spine is combined into one document by default now.
exclude = [
  "site.typ",
  "data/artifacts.typ",
  "data/books.typ",
  "data/digital-archives.typ",
  "data/documentaries.typ",
  "data/events.typ",
  "data/funding.typ",
  "data/hacker-archives.typ",
  "data/magazines.typ",
  "data/people.typ",
  "data/practice.typ",
  "data/tools.typ",
  "about.typ",
  "contribute.typ",
  "index.typ",
  "resources.typ",
]

[epub.spine]
title = "Hacker Archives"
exclude = [
  "site.typ",
  "data/artifacts.typ",
  "data/books.typ",
  "data/digital-archives.typ",
  "data/documentaries.typ",
  "data/events.typ",
  "data/funding.typ",
  "data/hacker-archives.typ",
  "data/magazines.typ",
  "data/people.typ",
  "data/practice.typ",
  "data/tools.typ",
  "contribute.typ",
  "index.typ",
  "resources.typ",
]
